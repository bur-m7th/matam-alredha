services:
  matam:
    build: .
    image: matam-alredha:latest
    container_name: matam-alredha
    restart: unless-stopped

    # No port is published. The Cloudflare tunnel container reaches the app
    # over the internal network below, so nothing is exposed on the host at all.
    # If you would rather run your own reverse proxy on the host instead,
    # uncomment this and point the proxy at 127.0.0.1:8080.
    # ports:
    #   - "127.0.0.1:8080:8080"

    networks:
      - matam

    environment:
      DATA_DIR: /data
      LISTEN_ADDR: ":8080"
      TZ: Asia/Bahrain

      # Set to "false" only while testing over plain http://localhost.
      COOKIE_SECURE: "true"

      # Secret URL segments for the two dashboards.
      ADMIN_PATH: "${ADMIN_PATH:-admin}"
      ELECTIONS_PATH: "${ELECTIONS_PATH:-elections}"

      # First boot only. Both accounts are created once and then ignored;
      # change the passwords from inside each dashboard afterwards.
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}"
      ELECTIONS_USERNAME: "${ELECTIONS_USERNAME:-elections}"
      ELECTIONS_PASSWORD: "${ELECTIONS_PASSWORD:?set ELECTIONS_PASSWORD in .env}"

      # Lockout recovery. Leave unset in normal operation.
      ADMIN_PASSWORD_RESET: "${ADMIN_PASSWORD_RESET:-false}"
      ELECTIONS_PASSWORD_RESET: "${ELECTIONS_PASSWORD_RESET:-false}"

      # Required behind Cloudflare or any reverse proxy, so rate limiting sees
      # the real visitor rather than the proxy. Leave it false if the container
      # is ever reachable directly: the header can otherwise be forged.
      TRUST_PROXY: "true"

      MAX_UPLOAD_MB: "5"
      REGISTER_LIMIT_PER_HOUR: "40"

    volumes:
      # Holds the database, the candidate photos and the exported workbook.
      # Back this up; everything else in the image is disposable.
      - matam-data:/data

    healthcheck:
      test: ["CMD", "/app/matam", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------
  # Cloudflare tunnel. Create the tunnel in the Cloudflare dashboard, copy the
  # token into .env, and this container connects outward — no inbound ports,
  # no port forwarding on the router, works behind CGNAT.
  # Delete this whole service if you are using your own reverse proxy instead.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: matam-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - matam
    networks:
      - matam

networks:
  matam:
    driver: bridge

volumes:
  matam-data:
